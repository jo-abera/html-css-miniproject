<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | DataSync Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style/signupstyle.css">
</head>
<body>
  <div class="signup-layout">

    <!-- Left: Collaboration Banner Image -->
    <aside class="signup-banner" aria-label="Team collaboration">
      <img src="assets/images/recent_referrals.jpg" alt="Team collaborating in a modern office">
    </aside>

    <!-- Right: Sign Up Form Card -->
    <main class="signup-main">
      <section class="signup-card">
        <h1 class="signup-title">Sign Up</h1>

        <form class="signup-form" action="#" method="post">
          <div class="form-group">
            <label for="full-name" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <svg class="input-icon input-icon--left" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
              <input
                type="text"
                id="full-name"
                name="full-name"
                class="form-input form-input--icon-left"
                placeholder="Full Name"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon input-icon--left" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input form-input--icon-left"
                placeholder="Email"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <div class="input-wrapper">
              <svg class="input-icon input-icon--left" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                class="form-input form-input--icon-left form-input--icon-right"
                placeholder="Password"
                required
              >
              <button type="button" class="input-icon-btn" aria-label="Toggle password visibility">
                <svg class="input-icon input-icon--right" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="signup-redirect">
          Already have an account?
          <a href="signin.html" class="link link-primary">Sign In</a>
        </p>
      </section>
    </main>

  </div>
</body>
</html>
